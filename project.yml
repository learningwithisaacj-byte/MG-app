# XcodeGen spec: run `xcodegen` in this folder to create MGEV.xcodeproj (see README.md).
name: MGEV
options:
  bundleIdPrefix: com.example.mgev   # change to your own reverse-domain prefix before installing
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""             # set to your Apple team in Xcode (Signing & Capabilities)
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MGEVKit:
    path: Packages/MGEVKit
targets:
  MGEV:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: MGEVKit
        product: MGKit
      - package: MGEVKit
        product: EVCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MG EV
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: Face ID confirms each command sent to your car.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mgev.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
schemes:
  MGEV:
    build:
      targets:
        MGEV: all
    test:
      gatherCoverageData: false
